name: Conda C++/Python/Redis - gcc,OpenMPI,Redis,UCX/UCC

on:
  push:
    branches:
      - main
      - mirror
      - 0.**
  pull_request:
    branches:
      - main
      - mirror
      - 0.**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: ubuntu-22.04
            gcc: 11
            ucc: "v1.6.0"

    steps:
      - uses: actions/checkout@v4

      # Specify the correct host compilers
      - name: Install/Select gcc and g++
        run: |
          sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} git autoconf automake libtool
          echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

      - name: Install Miniconda
        run: |
          wget --quiet https://repo.anaconda.com/miniconda/Miniconda3-py310_23.3.1-0-Linux-x86_64.sh -O ~/miniconda.sh
          bash ~/miniconda.sh -b -p $HOME/miniconda3
          rm ~/miniconda.sh
          echo ". $HOME/miniconda3/etc/profile.d/conda.sh" >> ~/.bash_profile

      - name: Create conda environment
        run: |
          conda install -n base conda-libmamba-solver -y
          conda config --set solver libmamba
          conda env create -f conda/environments/cylon_NoUCX.yml
          echo "conda activate cylon_dev" >> ~/.bash_profile

      - name: Install UCC
        run: |
          git clone --single-branch -b ${{ matrix.ucc }} https://github.com/openucx/ucc.git $HOME/ucc
          cd $HOME/ucc
          echo "conda ucx: $(conda list | grep ucx)"
          ./autogen.sh
          ./configure --prefix=$HOME/ucc/install --with-ucx=$CONDA/envs/cylon_dev
          make install

      - name: Install Redis
        run: |
          git clone https://github.com/redis/hiredis.git $HOME/hiredis
          cd $HOME/hiredis
          make
          sudo make install
          git clone https://github.com/sewenew/redis-plus-plus.git $HOME/redis-plus-plus
          cd $HOME/redis-plus-plus
          mkdir build
          cd build
          cmake -DREDIS_PLUS_PLUS_CXX_STANDARD=11 ..
          make
          sudo make install
          sudo ldconfig

      - name: Build cylon, pycylon and run cpp test
        run: python build.py -cmake-flags="-DCYLON_UCX=1 -DCYLON_UCC=1 -DUCC_INSTALL_PREFIX=$HOME/ucc/install -DCYLON_USE_REDIS=1" -ipath="$HOME/cylon/install" --cpp --python --test

      - name: Run pytest
        run: python build.py -ipath="$HOME/cylon/install" --pytest

      - name: Build Java
        run: python build.py -ipath="$HOME/cylon/install" --java
