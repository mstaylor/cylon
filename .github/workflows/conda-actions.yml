name: Conda C++/Python - gcc,OpenMPI  & GCylon

on:
  push:
    branches:
      - main
      - mirror
      - 0.**
  pull_request:
    branches:
      - main
      - mirror
      - 0.**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cuDF 24.x requires C++20 which needs CUDA 12.x
          - os: ubuntu-22.04
            cuda: "12.4.1"
            gcc: 11
            ucc: "v1.6.0"

    steps:
    - uses: actions/checkout@v4

    - name: Clean-up container
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    # Specify the correct host compilers
    - name: Install/Select gcc and g++
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} autoconf automake libtool libnuma-dev
        echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CUDAHOSTCXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

    - uses: Jimver/cuda-toolkit@v0.2.16
      id: cuda-toolkit
      with:
        cuda: ${{ matrix.cuda }}

    # Use cylon.yml (has UCX from conda) - consistent with conda-cpp-redis
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        activate-environment: cylon_dev
        environment-file: conda/environments/cylon.yml

    # Install cuDF/RMM from rapidsai for gcylon
    - name: Install cuDF and RMM
      run: |
        conda install -c rapidsai -c conda-forge -c nvidia \
            cudf=24.10 libcudf=24.10 rmm=24.10 librmm=24.10 \
            cuda-version=12.4 -y
        echo "=== Installed versions ==="
        conda list | grep -E "cudf|rmm|cccl"

    - name: Build cylon and pycylon
      run: python build.py -ipath="$HOME/cylon/install" --cpp --python --test

    - name: Run pytest
      run: python build.py -ipath="$HOME/cylon/install" --pytest

    - name: Build gcylon (no GPU testing on GitHub)
      run: |
        export CYLON_LIB_DIR=$HOME/cylon/install/lib
        mkdir -p cpp/build_gcylon
        cd cpp/build_gcylon
        cmake ../src/gcylon \
            -DCYLON_VERSION=0.7.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_LIBRARY_PATH="$CONDA_PREFIX/lib" \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
        make -j$(nproc)
        make install

    - name: Build pygcylon (no GPU testing on GitHub)
      run: |
        export CYLON_LIB_DIR=$HOME/cylon/install/lib
        export GCYLON_LIB_DIR=cpp/build_gcylon/lib
        export LD_LIBRARY_PATH="$GCYLON_LIB_DIR:$CYLON_LIB_DIR:$CONDA_PREFIX/lib"
        export CUDA_HOME=/usr/local/cuda
        export LIBRARY_PATH="$CYLON_LIB_DIR:$LIBRARY_PATH"
        cd python/pygcylon
        python setup.py build_ext --inplace
        pip install --no-build-isolation .