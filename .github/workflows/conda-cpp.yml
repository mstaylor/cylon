name: Conda C++/Python - gcc,OpenMPI,Gloo,UCX/UCC

on:
  push:
    branches:
      - main
      - mirror
      - 0.**
  pull_request:
    branches:
      - main
      - mirror
      - 0.**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      # explicit include-based build matrix, of known valid options
      matrix:
        include:
          - os: ubuntu-22.04
            gcc: 11
            ucc: "v1.6.0"
            ucx: "v1.19.1"

    steps:
      - uses: actions/checkout@v4

      # Specify the correct host compilers
      - name: Install/Select gcc and g++
        run: |
          sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} git autoconf automake libtool
          echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"  # You can specify a version or leave it as "latest"
          auto-update-conda: true
          activate-environment: cylon_dev
          environment-file: conda/environments/cylon_NoUCX.yml

      - name: Install Gloo
        run: |
          git clone --single-branch https://github.com/nirandaperera/gloo.git $HOME/gloo
          mkdir -p $HOME/gloo/build && cd $HOME/gloo/build
          cmake .. -DBUILD_SHARED_LIBS=1 -DUSE_MPI=1 -DCMAKE_INSTALL_PREFIX=$HOME/gloo/install -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_STANDARD=17
          make install

      - name: Install UCX
        run: |
          git clone --single-branch -b ${{ matrix.ucx }} https://github.com/openucx/ucx.git $HOME/ucx
          cd $HOME/ucx
          ./autogen.sh
          ./configure --prefix=$HOME/ucx/install --without-go
          make install      

      - name: Install UCC
        run: |
          git clone --single-branch -b ${{ matrix.ucc }} https://github.com/openucx/ucc.git $HOME/ucc
          cd $HOME/ucc
          ./autogen.sh
          ./configure --prefix=$HOME/ucc/install --with-ucx=$HOME/ucx/install
          make install

      - name: Set library paths
        run: |
          mkdir -p $CONDA_PREFIX/etc/conda/activate.d
          echo 'export LD_LIBRARY_PATH=$HOME/ucx/install/lib:$HOME/ucc/install/lib:$LD_LIBRARY_PATH' > $CONDA_PREFIX/etc/conda/activate.d/ucx_paths.sh
          # Cylon is built against the from-source UCX/UCC. The remaining hazard is
          # runtime-only: under mpirun, Open MPI loads its conda-bundled UCX plugin
          # mca_pml_ucx.so, which has DT_RPATH=$ORIGIN/.. (conda/lib). DT_RPATH is
          # searched BEFORE LD_LIBRARY_PATH, so it force-loads conda's libuct/libucs no
          # matter how LD_LIBRARY_PATH is ordered; when pycylon then imports, its libuct
          # SONAME is already satisfied by conda's copy, which is paired with the
          # from-source libucs it links against -> "undefined symbol:
          # ucs_netlink_is_best_route". Two mitigations, applied in the test steps
          # below via LD_PRELOAD (the only loader mechanism that outranks DT_RPATH):
          # force the from-source UCX resident first. These OMPI_MCA settings are a
          # secondary guard that keeps Open MPI off its UCX plugin entirely (CI is
          # single-node, so ob1 + tcp/sm suffices); cylon's own UCX/UCC collectives are
          # unaffected.
          echo "OMPI_MCA_pml=ob1" >> $GITHUB_ENV
          echo "OMPI_MCA_osc=^ucx" >> $GITHUB_ENV
          echo "OMPI_MCA_coll=^ucc" >> $GITHUB_ENV
          echo "OMPI_MCA_btl=^uct" >> $GITHUB_ENV

      - name: Build cylon, pycylon and run cpp test
        run: python build.py -cmake-flags="-DCYLON_UCX=1 -DCYLON_GLOO=1 -DGLOO_INSTALL_PREFIX=$HOME/gloo/install -DCYLON_UCC=1 -DUCC_INSTALL_PREFIX=$HOME/ucc/install -DUCX_INSTALL_PREFIX=$HOME/ucx/install" -ipath="$HOME/cylon/install" --cpp --python --test

      - name: Run pytest
        run: |
          export LD_LIBRARY_PATH=$HOME/ucx/install/lib:$HOME/ucc/install/lib:$LD_LIBRARY_PATH
          # Force the from-source UCX resident first so it wins over conda openmpi's
          # mca_pml_ucx.so DT_RPATH (which LD_LIBRARY_PATH cannot override). Every
          # library that then needs a UCX SONAME reuses these preloaded copies, so the
          # whole process runs on the single from-source UCX. Inherited by build.py's
          # mpirun child ranks (single-node CI).
          export LD_PRELOAD="$HOME/ucx/install/lib/libucm.so.0:$HOME/ucx/install/lib/libucs.so.0:$HOME/ucx/install/lib/libuct.so.0:$HOME/ucx/install/lib/libucp.so.0"
          python build.py -ipath="$HOME/cylon/install" --pytest

      - name: Build Java
        run: |
          export LD_LIBRARY_PATH=$HOME/ucx/install/lib:$HOME/ucc/install/lib:$LD_LIBRARY_PATH
          # Same from-source-UCX preload as the pytest step (Java tests also run under mpirun).
          export LD_PRELOAD="$HOME/ucx/install/lib/libucm.so.0:$HOME/ucx/install/lib/libucs.so.0:$HOME/ucx/install/lib/libuct.so.0:$HOME/ucx/install/lib/libucp.so.0"
          python build.py -ipath="$HOME/cylon/install" --java
