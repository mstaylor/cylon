name: Native C++/Python - gcc,OpenMPI

on:
  push:
    branches:
      - main
      - mirror
      - 0.**
  pull_request:
    branches:
      - main
      - mirror
      - 0.**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            gcc: 11

    steps:
    - uses: actions/checkout@v4

    # Specify the correct host compilers
    - name: Install/Select gcc and g++
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} autoconf automake libtool libnuma-dev
        echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        activate-environment: cylon_dev
        environment-file: conda/environments/cylon.yml

    - name: Configure Open MPI transports (single-node CI)
      run: |
        # Single-node CI: use the ob1 PML and exclude Open MPI's UCX/UCC plugins so it
        # never dlopens a bundled UCX that could mix with cylon's UCX at runtime (see
        # conda-cpp.yml for the "undefined symbol: ucs_netlink_is_best_route" failure
        # this prevents). Cylon's own collectives are unaffected.
        echo "OMPI_MCA_pml=ob1" >> $GITHUB_ENV
        echo "OMPI_MCA_osc=^ucx" >> $GITHUB_ENV
        echo "OMPI_MCA_coll=^ucc" >> $GITHUB_ENV
        echo "OMPI_MCA_btl=^uct" >> $GITHUB_ENV

    - name: Build cylon, pycylon and run cpp test
      run: python build.py -ipath="$HOME/cylon/install" --cpp --python --test

    - name: Run pytest
      run: python build.py -ipath="$HOME/cylon/install" --pytest

    - name: Build Java
      run: python build.py -ipath="$HOME/cylon/install" --java