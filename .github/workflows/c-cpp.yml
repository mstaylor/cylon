name: Native C++/Python - gcc,OpenMPI

on:
  push:
    branches:
      - main
      - mirror
      - 0.**
  pull_request:
    branches:
      - main
      - mirror
      - 0.**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            gcc: 11

    steps:
    - uses: actions/checkout@v4

    # Specify the correct host compilers
    - name: Install/Select gcc and g++
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} autoconf automake libtool libnuma-dev
        echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "py312_24.11.1-0"
        auto-update-conda: false
        activate-environment: cylon_dev
        environment-file: conda/environments/cylon.yml

    - name: Build cylon, pycylon and run cpp test
      run: python build.py -ipath="$HOME/cylon/install" --cpp --python --test

    - name: Diagnose pycylon install
      run: |
        echo "=== pip show pycylon ==="
        pip show pycylon || echo "pycylon not installed via pip"
        echo "=== .so files in site-packages ==="
        find $(python -c "import site; print(site.getsitepackages()[0])")/pycylon -name "*.so" 2>/dev/null | head -10 || echo "none found"
        echo "=== .so files in source tree ==="
        find python/pycylon/pycylon/data -name "*.so" 2>/dev/null | head -5 || echo "none found"
        echo "=== try import ==="
        python -v -c "from pycylon.data.table import Table" 2>&1 | tail -30 || true

    - name: Run pytest
      run: python build.py -ipath="$HOME/cylon/install" --pytest

    - name: Build Java
      run: python build.py -ipath="$HOME/cylon/install" --java