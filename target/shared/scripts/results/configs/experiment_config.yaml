##
# Cylon Experiment Results Pipeline Configuration
#
# Each experiment defines a platform, scaling type, instance configuration,
# and data source (S3 prefix or local directory).
#
# Local data paths are relative to the --local-dir CLI argument, or absolute.
# S3 prefixes are used when downloading from S3 (--step download).
##

s3_bucket: "staylor.dev2"
download_dir: "./data/raw"
output_dir: "./output"
chart_format: "svg"
chart_dpi: 300

experiments:
  # ============================================================
  # EC2 - Weak Scaling
  # ============================================================
  - platform: "ec2"
    scaling_type: "weak"
    instance_label: "16_28"
    instance_detail: "16GB Mem 28 vCPUs"
    node_counts: [1, 2, 4, 8, 16, 32]
    rows: 9100000
    operation: "join"
    color: "blue"
    marker: "o"
    local_data_dir: "/home/parallels/cylon_experiments/aws/results-9100000/ec2/16_28"

