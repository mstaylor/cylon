[package]
name = "cylon-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of Cylon DataFrame operations with SIMD support"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
simd = []

[dependencies]
# Arrow with WASM-compatible features only
arrow = { version = "53", default-features = false, features = ["ipc"] }
arrow-array = { version = "53", default-features = false }
arrow-schema = { version = "53", default-features = false }
arrow-select = { version = "53", default-features = false }
arrow-ord = { version = "53", default-features = false }
arrow-row = { version = "53", default-features = false }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling in WASM
console_error_panic_hook = { version = "0.1", optional = true }

# Hashmap for joins
hashbrown = "0.15"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release-small]
inherits = "release"
opt-level = "z"
